default_provider = "local"

[providers.local]
type     = "ollama"                      # native Ollama /api/chat, sets num_ctx
base_url = "http://127.0.0.1:11434"
model    = "qwen2.5:7b"
cloud    = false
# num_ctx = 16384                        # defaults to 16384 if unset

# Any other OpenAI-compatible server (LM Studio, vLLM, llama.cpp, mlx-lm's
# server, …) uses the generic openai type instead:
# [providers.mlx]
# type     = "openai"
# base_url = "http://127.0.0.1:8085/v1"
# model    = "qwen2.5:7b"
# cloud    = false

[providers.claude]
type        = "anthropic"
model       = "claude-sonnet-5"
api_key_env = "ANTHROPIC_API_KEY"
cloud       = true                       # => scrubbed before sending, always

[privacy]
redact = ["acme-corp", "10.10.0.206"]    # your own denylist, on top of built-ins
