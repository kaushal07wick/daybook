name: Bug
description: Something is wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: daybook version, placeholder: "daybook version" }
    validations: { required: true }
  - type: input
    id: provider
    attributes: { label: Provider + model, placeholder: "openai / qwen2.5:3b via Ollama" }
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include `daybook status --json` output if relevant. Never paste transcript content. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
